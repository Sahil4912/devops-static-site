name: Build, Push and Deploy Docker Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/devops-static-site:latest \
          -t ${{ secrets.DOCKER_USERNAME }}/devops-static-site:${{ github.sha }} .

    - name: Push latest tag
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/devops-static-site:latest

    - name: Push commit SHA tag
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/devops-static-site:${{ github.sha }}

    - name: Setup SSH Key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
        chmod 600 ~/.ssh/ec2_key.pem

    - name: Add EC2 Host
      run: |
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to EC2
      run: |
        ssh -o StrictHostKeyChecking=no \
        -i ~/.ssh/ec2_key.pem \
        ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << EOF

        echo "Pulling image: ${{ github.sha }}"

        docker pull ${{ secrets.DOCKER_USERNAME }}/devops-static-site:${{ github.sha }}

        docker stop devops-static-site || true

        docker rm devops-static-site || true

        docker run -d \
          --restart unless-stopped \
          --name devops-static-site \
          -p 80:80 \
          ${{ secrets.DOCKER_USERNAME }}/devops-static-site:${{ github.sha }}

        docker image prune -f

        echo "Running Containers:"
        docker ps

        echo "Deployed Image:"
        docker inspect devops-static-site --format='{{.Config.Image}}'

        EOF
